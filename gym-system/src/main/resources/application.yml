server:
  port: 8080

spring:
  application:
    name: gym-system
  datasource:
    # 驱动类
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接地址
    url: jdbc:mysql://localhost:3306/gym_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456  # <---【⚠️ 请务必确认这里是你的数据库密码】

    # --- HikariCP 连接池配置 ---
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: 5
      maximum-pool-size: 15
      auto-commit: true
      idle-timeout: 30000
      pool-name: GymHikariCP
      max-lifetime: 600000
      connection-test-query: SELECT 1
      validation-timeout: 3000

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 控制台打印 SQL
    map-underscore-to-camel-case: true # 开启驼峰命名转换
  global-config:
    db-config:
      id-type: auto # 主键策略：自增

# --- 🔥 新增：支付宝沙箱配置 ---
alipay:
  # 1. 你的沙箱 APPID (去支付宝开放平台沙箱环境看)
  app-id: 2021000148603415

  # 2. 你的应用私钥 (Merchant Private Key) - 只有你自己知道，不要给别人
  # 注意：YAML中如果秘钥包含换行，要么弄成一行，要么用引号包裹
  app-private-key: 

  # 3. 支付宝公钥 (Alipay Public Key) - 注意不是应用公钥！是支付宝给你的那个
  alipay-public-key: 

  # 4. 支付成功后的前端跳转页面 (根据你的 Vue 路由调整)
  return-url: http://localhost:5173/pay/success

  # 5. 异步通知地址 (选填，本地开发通常收不到，毕设演示可忽略)
  notify-url: http://localhost:8080/alipay/notify

# --- 🔥 新增：DeepSeek AI 配置（OpenAI 兼容协议）---
deepseek:
  # 总开关，false 时直接走本地规则 AI
  enabled: true
  # 优先读环境变量 DEEPSEEK_API_KEY，未设置时使用 yml 默认值（生产建议清空默认值）
  api-key: ${DEEPSEEK_API_KEY:sk-09295dde30184704a6183d85558e27b2}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout-ms: 15000
  temperature: 0.7